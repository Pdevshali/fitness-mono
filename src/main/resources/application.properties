spring.application.name=fitness-mono

# MYQL docker db conf
# Updated Database configuration for MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/fitness_mono_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=fitness_user
spring.datasource.password=fitness_pass

# Change the Dialect to MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Database configuration
#spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USER}
#spring.datasource.password=${DB_PASS}
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# redis db set-up
# Force Spring to use Redis and fail if it can't connect
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6380
logging.level.org.springframework.cache=TRACE

# Logging configuration
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# jpa configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
